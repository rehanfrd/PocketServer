name: Build ZingShare APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    
    - name: Setup Android & API 36 Fix
      run: |
        rm -rf android
        flutter create --platforms android .
        
        # Permissions add karna
        sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml
        
        # 🚀 THE ULTIMATE API 36 FIX (VIA LOCAL.PROPERTIES) 🚀
        echo "flutter.compileSdkVersion=36" >> android/local.properties
        echo "flutter.targetSdkVersion=36" >> android/local.properties
        
        # Ek aur backup fix (seedha file mein)
        sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle || true
        sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle || true

    - run: flutter pub get
    - run: flutter build apk --release --no-tree-shake-icons
    
    - uses: actions/upload-artifact@v4
      with:
        name: ZingShare-Premium
        path: build/app/outputs/flutter-apk/app-release.apk
